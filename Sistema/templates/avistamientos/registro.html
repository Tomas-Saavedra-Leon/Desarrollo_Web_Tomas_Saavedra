{% extends "componentes/base.html" %}

{% block contenido %}
<div class="contenedor-formulario">
    <h2>Registrar Avistamiento</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul class="mensajes-flash">
                {% for category, message in messages %}
                    <li class="{{ category }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('avistamientos_bp.registrar') }}" method="POST" enctype="multipart/form-data">

        <div class="form-columnas">


            <div class="columna-izquierda">

                <div class="grupo-input">
                    <label for="voluntario-id">Voluntario:</label>
                    <select name="voluntario-id" id="voluntario-id" required>
                        <option value="">Seleccione voluntario</option>
                        {% for voluntario in voluntarios %}
                            <option value="{{ voluntario.id }}">{{ voluntario.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="ave-avistamiento">Tipo de Ave:</label>
                    <select name="ave-avistamiento" id="ave-avistamiento" required>
                        <option value="">Seleccione un ave</option>
                        {% for ave in aves %}
                            <option value="{{ ave.id }}">{{ ave.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grupo-input">
                    <label for="foto-video">Subir Foto o Video:</label>
                    <input type="file" name="foto-video" id="foto-video" accept="image/*,video/*" required>
                </div>

            </div>

            <div class="columna-derecha">

                <div class="grupo-input">
                    <label for="lugar-avistamiento">Lugar:</label>
                    <input type="text" name="lugar-avistamiento" id="lugar-avistamiento"
                           placeholder="Ej: Parque Nacional Conguillío" required maxlength="200">
                </div>

                <div class="grupo-input">
                    <label for="fecha-hora">Fecha y Hora:</label>
                    <input type="datetime-local" name="fecha-hora" id="fecha-hora" required>
                </div>

                <div class="grupo-input">
                    <label for="descripcion-avistamiento">Descripción (Opcional):</label>
                    <textarea name="descripcion-avistamiento" id="descripcion-avistamiento"
                              rows="4" maxlength="500"
                              placeholder="Ej: El ave estaba posada sobre la rama más alta de un roble..."></textarea>
                </div>

            </div>

        </div>

        <div class="grupo-input" style="margin-top: 20px;">
            <button type="submit" class="btn-principal">Registrar Avistamiento</button>
        </div>

    </form>
</div>

<script src="{{ url_for('static', filename='js/valida_avistamientos.js') }}"></script>

{% endblock %}
